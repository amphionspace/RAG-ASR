# RAG-ASR service configuration.
#
# This is the single service configuration entry. Edit this file for the
# current deployment, or set RAG_ASR_CONFIG to another YAML file with the same
# schema.

model:
  base_model_path: /home/ubuntu/models/hf/Amphion/AmphionASR-1.7B
  adapter_subdir: hotword_adapter
  adapter_filename: best_adapter.pt
  # Optional explicit override for experiments. When omitted, retrieval_mode
  # selects base_model_path/hotword_adapter/{pooled,frame_max}/best_adapter.pt.
  # adapter_ckpt: checkpoints/adapters/amphion-1.7b_retrieval_v1.2/best_adapter.pt
  embed_dim: 512
  adapter_hidden_dim: 512

retrieval:
  hotword_pool_dir: var/hotwords
  seed_pool_file: examples/hotword_pool.txt
  # Historical field name. Semantics are the default hotword_pool_id.
  default_user: default
  # Optional legacy/default-user override. When omitted, the default user's
  # mutable pool is hotword_pool_dir/default.txt and examples stays read-only.
  # hotword_pool_file: var/hotwords/default.txt
  default_top_k: 50
  # pooled = pooled audio·text (v1.2); frame_max = max-over-frame GLCLAP (v2.0)
  retrieval_mode: frame_max
  cache_dir: var/retrieve_cache
  batch_text: 512
  # Persist embedding tensors and metadata only; raw enrollment audio is not stored.
  enrollment_store_dir: var/enrollments
  enrollment_cache_max_entries: 256
  enrollment_cache_device: auto
  enrollment_metadata_touch_interval_sec: 300

runtime:
  device: cuda
  cuda_visible_devices: "0"
  num_mel_bins: 128

triton:
  model_repo: triton
  rendered_model_repo: var/triton_repo
  # Build this conda-pack archive with scripts/build_triton_exec_env.sh.
  exec_env: var/triton-exec-env.tar.gz
  # Or point to a live conda env, e.g. /path/to/miniconda3/envs/triton-exec
  # backend_dir is auto-derived from tritonserver; set explicitly if needed.
  # backend_dir: /path/to/tritonserver/backends
  # Keep off for the default Triton 24.10 Python 3.10 backend stub. Set this
  # only when using a custom stub that expects a deployment-managed symlink.
  python_stub_link: off
  http_port: 10001
  grpc_port: 10002
  metrics_port: 10003
